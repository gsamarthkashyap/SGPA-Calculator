<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="calculate.js"></script>
</head>
<body>

    <h4 class="title">SGPA CALCULATOR</h4>

    <div class="container">
        <div class="input-group">
            <label for="ada">SEPM:</label>
            <input type="number" id="ada">
        </div>

        <div class="input-group">
            <label for="dms">CN:</label>
            <input type="number" id="dms">
        </div>

        <div class="input-group">
            <label for="dbms">TOC:</label>
            <input type="number" id="dbms">
        </div>

        <div class="input-group">
            <label for="ai">UNIX/DS:</label>
            <input type="number" id="ai">
        </div>

        <div class="input-group">
            <label for="adalab">RMIPR:</label>
            <input type="number" id="adalab">
        </div>

        <div class="input-group">
            <label for="biology">DV LAB:</label>
            <input type="number" id="biology">
        </div>

        <div class="input-group">
            <label for="uhv">EVS:</label>
            <input type="number" id="uhv">
        </div>

        <div class="input-group">
            <label for="julialab">MINI PROJECT:</label>
            <input type="number" id="julialab">
        </div>
    </div>

    <div class="buttons">
        <button type="button" onclick="calculateSGPA()" class="Calc">CALCULATE</button>
        <button type="button" onclick="resetFields()" class="Reset">RESET</button>
    </div>

    <h1 class="result">SGPA <span id="result">0</span></h1>

</body>
</html>
